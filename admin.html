<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Administração | Portal Notícias</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topo"><div class="topo-inner"><a class="logo" href="index.html">Portal <span>Notícias</span></a><button id="sair" class="btn btn-sec">Sair</button></div></header>
<main class="container admin-page"><h1>Gerenciar notícias</h1><p id="status"></p>
<section class="form-card"><h2 id="formTitulo">Nova notícia</h2><form id="noticiaForm"><input id="id" type="hidden"><label>Título<input id="titulo" required></label><label>Categoria<select id="categoria" required><option>Brasil</option><option>Mundo</option><option>Tecnologia</option><option>Esportes</option></select></label><label>Resumo<textarea id="resumo" rows="3" required></textarea></label><label>Texto da notícia<textarea id="conteudo" rows="6" required></textarea></label><label>URL da imagem (opcional)<input id="imagem" type="url"></label><button class="btn" type="submit">Salvar notícia</button><button class="btn btn-sec" type="button" id="cancelar">Cancelar edição</button></form></section>
<h2>Notícias cadastradas</h2><div id="adminLista" class="admin-lista"></div><p><a href="index.html">Voltar ao portal</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
