<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cadastro | Portal Notícias</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topo"><div class="topo-inner"><a class="logo" href="index.html">Portal <span>Notícias</span></a></div></header>
<main class="container form-page"><section class="form-card"><h1>Criar conta</h1><p>Cadastre-se para gerenciar notícias.</p>
<form id="cadastroForm"><label>Nome<input id="nome" type="text" required></label><label>Email<input id="email" type="email" required></label><label>Senha<input id="senha" type="password" required minlength="6"></label><button class="btn" type="submit">Cadastrar</button></form>
<p id="status"></p><p>Já possui conta? <a href="login.html">Entrar</a></p><a href="index.html">Voltar para o portal</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js"></script></body></html>
